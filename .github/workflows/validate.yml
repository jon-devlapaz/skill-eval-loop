name: Validate skill-eval-loop

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d8708 # v6.0.0
        with:
          python-version: "3.11"

      - name: Test Python evaluator
        run: python3 -m unittest discover -s tests -v

      - name: Run evaluator healthcheck
        run: skills/skill-eval-loop/scripts/healthcheck.sh

      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Reject tracked local artifacts
        run: |
          tracked="$(git ls-files -- .agents/ .eval-runs/)"
          if [ -n "$tracked" ]; then
            printf 'Local-only artifacts are tracked:\n%s\n' "$tracked"
            exit 1
          fi

  standalone-package:
    name: Verify standalone skill (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-amd64
            runner: macos-15-intel
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Copy only the installed skill payload
        run: cp -R skills/skill-eval-loop "$RUNNER_TEMP/skill-eval-loop"

      - name: Run the public launcher with only system Python
        working-directory: ${{ runner.temp }}
        run: |
          env -i \
            HOME="$RUNNER_TEMP" \
            PATH=/usr/bin:/bin \
            "$RUNNER_TEMP/skill-eval-loop/scripts/skill-eval-loop" healthcheck \
              --skill-dir "$RUNNER_TEMP/skill-eval-loop"

  tink-package:
    name: Verify checked-out package through Tink
    runs-on: ubuntu-22.04
    env:
      TINK_REVISION: 2b082b5032b6f6cef6ea301868c499a93b86552f
      TINK_SOURCE: https://github.com/jon-devlapaz/tink.git
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.95.0

      - name: Install pinned Tink
        run: |
          export CARGO_HOME="$RUNNER_TEMP/tink-cargo-home"
          tink_prefix="$RUNNER_TEMP/tink-prefix"
          cargo install --git "$TINK_SOURCE" --rev "$TINK_REVISION" \
            --locked --root "$tink_prefix"
          test "$("$tink_prefix/bin/tink" --version)" = "tink 1.0.0"

      - name: Exercise the checked-out candidate with isolated state
        shell: bash
        run: |
          set -euo pipefail
          project_root="$(mktemp -d)"
          tink_home="$(mktemp -d)"
          tink="$RUNNER_TEMP/tink-prefix/bin/tink"
          export TINK_HOME="$tink_home"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.file://${GITHUB_WORKSPACE}/.insteadOf"
          export GIT_CONFIG_VALUE_0="https://github.com/jon-devlapaz/skill-eval-loop.git"

          cd "$project_root"
          "$tink" init --no-zen --no-tink-skills --no-manage-tink
          "$tink" skill add jon-devlapaz/skill-eval-loop --skill skill-eval-loop
          "$tink" skill check
          "$tink" skill lock
          "$tink" skill verify

          evaluator="$project_root/.agents/skills/skill-eval-loop/scripts/skill-eval-loop"
          "$evaluator" healthcheck
